<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKA Labs — Research</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface-hover: #1a1a1e;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #71717a;
      --accent: #8b5cf6;
      --accent-dim: rgba(139, 92, 246, 0.12);
      --green: #22c55e;
      --green-dim: rgba(34, 197, 94, 0.12);
      --yellow: #eab308;
      --yellow-dim: rgba(234, 179, 8, 0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* HEADER */
    header {
      padding: 48px 0 40px;
    }

    .logo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .logo span { color: var(--accent); }

    h1 {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -1px;
      margin-top: 20px;
      line-height: 1.15;
    }

    h1 .accent { color: var(--accent); }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 10px;
      max-width: 460px;
    }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 40px;
    }

    /* PROJECT LIST */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    .project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .project-row:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .project-row.disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: default;
    }

    .project-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .project-icon {
      font-size: 28px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .project-info h3 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }

    .project-info p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .project-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-live {
      background: var(--green-dim);
      color: var(--green);
    }

    .badge-soon {
      background: var(--yellow-dim);
      color: var(--yellow);
    }

    .arrow {
      color: var(--text-muted);
      font-size: 18px;
      transition: color 0.15s;
    }

    .project-row:hover .arrow { color: var(--accent); }

    /* FOOTER */
    footer {
      padding: 32px 0;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    footer p {
      font-size: 13px;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <div class="logo">ZK<span>A</span> Labs</div>
      <h1>Research <span class="accent">&</span> Projects</h1>
      <p class="subtitle">AI models, agents, and infrastructure. Built in public.</p>
    </header>

    <div class="divider"></div>

    <!-- PROJECTS -->
    <div class="project-list">

      <!-- ZK Agent — LIVE -->
      <a href="https://zeroknowledge0x.github.io/zk-api/" class="project-row" target="_blank">
        <div class="project-left">
          <div class="project-icon">🤖</div>
          <div class="project-info">
            <h3>ZK Agent</h3>
            <p>Multi-model AI platform — 3 models, OpenAI-compatible API</p>
          </div>
        </div>
        <div class="project-right">
          <span class="badge badge-live">Live</span>
          <span class="arrow">→</span>
        </div>
      </a>

      <!-- Coming Soon 1 -->
      <div class="project-row disabled">
        <div class="project-left">
          <div class="project-icon">🧠</div>
          <div class="project-info">
            <h3>ZK v1b</h3>
            <p>Custom fine-tuned language model</p>
          </div>
        </div>
        <div class="project-right">
          <span class="badge badge-soon">Soon</span>
        </div>
      </div>

      <!-- Coming Soon 2 -->
      <div class="project-row disabled">
        <div class="project-left">
          <div class="project-icon">🔬</div>
          <div class="project-info">
            <h3>ZK Research</h3>
            <p>AI safety & alignment experiments</p>
          </div>
        </div>
        <div class="project-right">
          <span class="badge badge-soon">Soon</span>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 ZKA Labs</p>
      <a href="https://github.com/zeroknowledge0x" target="_blank">GitHub</a>
    </footer>

  </div>

</body>
</html>
